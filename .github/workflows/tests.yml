name: Tests

# Runs every tests/*.test.sh. The suites stub gh and build their fixtures in
# temp dirs, so nothing here reads org data or needs a token beyond checkout.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install jq
        run: command -v jq >/dev/null || { sudo apt-get update && sudo apt-get install -y jq; }

      - name: Run test suites
        run: |
          shopt -s nullglob
          suites=(tests/*.test.sh)
          if [ "${#suites[@]}" -eq 0 ]; then
            echo "no tests/*.test.sh suites found" >&2
            exit 1
          fi
          fail=0
          for t in "${suites[@]}"; do
            echo "::group::$t"
            bash "$t" || fail=1
            echo "::endgroup::"
          done
          exit "$fail"
